<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>우리 결혼합니다</title>

<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="우리 결혼합니다">
<meta property="og:description" id="ogDesc" content="소중한 당신을 초대합니다.">
<meta property="og:image" id="ogImage" content="images/main.jpg">
<meta name="description" content="소중한 당신을 초대합니다.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <!-- ===== 1. 인트로 ===== -->
  <section class="sec sec--intro reveal">
    <p class="script script--lg" id="introScript">Invite you</p>
    <p class="intro__sub" id="introSub">소중한 당신을 초대합니다.</p>
  </section>

  <!-- ===== 2. 메인 사진 ===== -->
  <section class="sec sec--hero reveal">
    <div class="hero">
      <div class="hero__side">
        <p class="hero__en">the<br>wedding<br>ceremony</p>
        <div class="hero__meta">
          <p class="hero__names" id="heroNames"></p>
          <p class="hero__when" id="heroWhen"></p>
          <p class="hero__where" id="heroWhere"></p>
        </div>
      </div>
      <figure class="hero__photo ph">
        <img id="mainPhoto" alt="웨딩 사진">
      </figure>
    </div>
  </section>

  <!-- ===== 3. 인사말 ===== -->
  <section class="sec sec--greeting reveal">
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 220 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 17h70M140 17h70" stroke="currentColor" stroke-width=".8" stroke-linecap="round" opacity=".5"/>
        <path d="M110 6c-6 4-9 7-9 11s3 7 9 11c6-4 9-7 9-11s-3-7-9-11z" stroke="currentColor" stroke-width=".9" opacity=".85"/>
        <path d="M110 6v22M94 17h32" stroke="currentColor" stroke-width=".6" opacity=".45"/>
        <circle cx="88" cy="17" r="1.6" fill="currentColor" opacity=".55"/>
        <circle cx="132" cy="17" r="1.6" fill="currentColor" opacity=".55"/>
      </svg>
    </div>

    <p class="greeting__body" id="greetingBody"></p>

    <div class="ornament ornament--flip" aria-hidden="true">
      <svg viewBox="0 0 220 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 17h70M140 17h70" stroke="currentColor" stroke-width=".8" stroke-linecap="round" opacity=".5"/>
        <path d="M110 6c-6 4-9 7-9 11s3 7 9 11c6-4 9-7 9-11s-3-7-9-11z" stroke="currentColor" stroke-width=".9" opacity=".85"/>
        <path d="M110 6v22M94 17h32" stroke="currentColor" stroke-width=".6" opacity=".45"/>
        <circle cx="88" cy="17" r="1.6" fill="currentColor" opacity=".55"/>
        <circle cx="132" cy="17" r="1.6" fill="currentColor" opacity=".55"/>
      </svg>
    </div>

    <div class="family" id="family"></div>

    <button class="btn btn--line" id="btnContact" type="button">연락하기</button>
  </section>

  <!-- ===== 4. 날짜 / 캘린더 / 디데이 ===== -->
  <section class="sec sec--date reveal">
    <p class="date__line" id="dateLine1"></p>
    <p class="date__line date__line--sm" id="dateLine2"></p>

    <div class="cal" id="calendar"></div>

    <p class="dday__names" id="ddayNames"></p>
    <p class="dday__label" id="ddayLabel"></p>
    <p class="dday__count" id="ddayCount"></p>
  </section>

  <!-- ===== 5. 갤러리 ===== -->
  <section class="sec sec--gallery reveal">
    <h2 class="script">gallery</h2>
    <div class="gal" id="gallery"></div>
    <button class="btn btn--ghost" id="galToggle" type="button">사진 더보기</button>
  </section>

  <!-- ===== 6. 오시는 길 ===== -->
  <section class="sec sec--loc reveal">
    <h2 class="script">location</h2>
    <p class="loc__venue" id="locVenue"></p>
    <p class="loc__hall" id="locHall"></p>
    <p class="loc__when" id="locWhen"></p>

    <div class="map" id="map">
      <div class="map__ph" id="mapPh">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 4c-7.2 0-13 5.8-13 13 0 9.8 13 27 13 27s13-17.2 13-27c0-7.2-5.8-13-13-13z" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="24" cy="17" r="4.6" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span id="mapPhText"></span>
      </div>
    </div>

    <div class="addr">
      <p class="addr__row"><b>도로명</b><span id="addrRoad"></span><button class="copy" data-copy-target="addrRoad" type="button">복사</button></p>
      <p class="addr__row" id="jibunRow"><b>지번</b><span id="addrJibun"></span></p>
      <p class="addr__row" id="telRow"><b>전화</b><a id="venueTel" href="#"></a></p>
    </div>

    <div class="map__btns" id="mapBtns"></div>

    <div class="transport" id="transport"></div>
  </section>

  <!-- ===== 7. 마음 전하실 곳 ===== -->
  <section class="sec sec--acc reveal" id="secAcc">
    <h2 class="title">마음 전하실 곳</h2>
    <p class="acc__desc">
      멀리서도 축하의 마음을 전하고 싶으신 분들을 위해<br>
      계좌번호를 안내드립니다.<br>
      너그러운 마음으로 양해 부탁드립니다.
    </p>
    <div class="acc" id="accounts"></div>
    <div class="wreath" id="wreath"></div>
  </section>

  <!-- ===== 8. 방명록 ===== -->
  <section class="sec sec--gb reveal">
    <h2 class="script">guestbook</h2>
    <p class="gb__desc">신랑 신부에게 축하의 말을 남겨주세요.</p>
    <button class="btn btn--solid" id="gbWrite" type="button">축하글 남기기 💐</button>
    <div class="gb__list" id="gbList"></div>
    <div class="gb__pager" id="gbPager"></div>
  </section>

  <!-- ===== 9. 푸터 ===== -->
  <footer class="sec sec--foot reveal">
    <p class="foot__msg">행복하게 잘 살겠습니다.</p>
    <p class="script script--md" id="footNames"></p>
    <p class="foot__sub" id="footWhere"></p>
    <p class="foot__sub" id="footWhen"></p>

    <div class="foot__share">
      <button class="chip" id="shareKakao" type="button">카카오톡 공유</button>
      <button class="chip" id="shareLink" type="button">링크 복사</button>
    </div>
  </footer>
</div>

<!-- ===== 연락처 모달 ===== -->
<div class="modal" id="mContact" hidden>
  <div class="modal__dim" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-label="연락하기">
    <h3 class="modal__title">연락하기</h3>
    <div class="contact" id="contactList"></div>
    <button class="btn btn--line btn--sm" data-close type="button">닫기</button>
  </div>
</div>

<!-- ===== 갤러리 라이트박스 ===== -->
<div class="lb" id="lightbox" hidden>
  <button class="lb__x" data-close type="button" aria-label="닫기">&times;</button>
  <button class="lb__nav lb__nav--prev" id="lbPrev" type="button" aria-label="이전">&#8249;</button>
  <div class="lb__stage"><img id="lbImg" alt=""></div>
  <button class="lb__nav lb__nav--next" id="lbNext" type="button" aria-label="다음">&#8250;</button>
  <p class="lb__count" id="lbCount"></p>
</div>

<!-- ===== 방명록 작성 모달 ===== -->
<div class="modal" id="mGb" hidden>
  <div class="modal__dim" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-label="축하글 남기기">
    <h3 class="modal__title">축하글 남기기</h3>
    <form id="gbForm" class="form">
      <label class="field"><span>이름</span><input name="name" maxlength="12" required placeholder="성함을 남겨주세요"></label>
      <label class="field"><span>비밀번호</span><input name="pw" type="password" maxlength="20" required placeholder="삭제할 때 필요해요 (4자 이상)"></label>
      <label class="field"><span>축하 메시지</span><textarea name="msg" maxlength="300" rows="5" required placeholder="따뜻한 한마디를 남겨주세요"></textarea></label>
      <p class="form__err" id="gbErr" hidden></p>
      <div class="form__btns">
        <button class="btn btn--line btn--sm" data-close type="button">취소</button>
        <button class="btn btn--solid btn--sm" type="submit">남기기</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== 방명록 삭제 모달 ===== -->
<div class="modal" id="mDel" hidden>
  <div class="modal__dim" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-label="축하글 삭제">
    <h3 class="modal__title">축하글 삭제</h3>
    <form id="delForm" class="form">
      <label class="field"><span>비밀번호</span><input name="pw" type="password" maxlength="20" required placeholder="작성할 때 입력한 비밀번호"></label>
      <p class="form__err" id="delErr" hidden></p>
      <div class="form__btns">
        <button class="btn btn--line btn--sm" data-close type="button">취소</button>
        <button class="btn btn--solid btn--sm" type="submit">삭제</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script type="module" src="js/guestbook.js"></script>
</body>
</html>
